[project]
name = "openengine"
version = "0.1.0"
description = "Programmatic design, thermodynamic simulation, and CAD/CFD/FEA pipeline for a 1-cylinder 4-stroke SOHC engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cantera>=3.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "sympy>=1.12.0",
    "build123d>=0.13.0",
    "cadquery-ocp-novtk==8.0.1.0.0",
    "gmsh>=4.13.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
]

[project.scripts]
openengine = "openengine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openengine"]
